<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review Desk · WPS</title>
  <link rel="stylesheet" href="./taskpane.css" />
</head>
<body>
  <div class="rd-app">
    <aside class="rd-side">
      <header class="rd-side-head">
        <div class="rd-title-row">
          <span id="conn-dot" class="rd-dot" title="后端连接状态"></span>
          <h1>文稿审核台</h1>
        </div>
        <p id="doc-name" class="rd-doc-name" title="当前文档"></p>
        <p class="rd-sub">选中文字 → 审核 → 批注 / 修订</p>
      </header>

      <details class="rd-settings">
        <summary>模型 / 推理 / 输出设置 <span id="settings-summary" class="rd-settings-summary"></span></summary>
        <label>模型
          <select id="setting-model"><option value="">（默认：DSH 设置）</option></select>
        </label>
        <label>推理等级
          <select id="setting-effort"><option value="">（默认）</option></select>
        </label>
        <label>输出上限
          <select id="setting-cap"><option value="0">（默认）</option></select>
        </label>
        <label class="rd-check">
          <input id="setting-segment" type="checkbox" checked />
          <span>长文自动分段（选中 &gt; 1200 字时分段审阅）</span>
        </label>
        <p id="settings-hint" class="rd-hint">默认使用 DSH 的模型与推理设置；上限越高越慢、费用越高。</p>
      </details>

      <section class="rd-select-card">
        <div class="rd-row">
          <span class="rd-label">当前选区</span>
          <button id="btn-refresh" class="rd-mini" type="button">刷新</button>
        </div>
        <div id="selection-preview" class="rd-selection">尚未选中文字（在文档中拖动选中一段后再操作）</div>
        <div id="selection-meta" class="rd-meta-line"></div>
      </section>

      <section class="rd-run">
        <div class="rd-grid">
          <button type="button" class="rd-action" data-action="source">来源查证</button>
          <button type="button" class="rd-action" data-action="logic">逻辑分析</button>
          <button type="button" class="rd-action" data-action="expand">扩写</button>
          <button type="button" class="rd-action" data-action="relate">关联分析</button>
        </div>
        <div class="rd-custom">
          <input id="instruction" type="text" maxlength="500" placeholder="自由要求，例如：压缩到 60 字" />
          <button id="btn-custom" type="button" class="rd-primary">执行</button>
        </div>
        <div class="rd-batch-run">
          <select id="batch-action" title="整篇审阅使用哪个动作">
            <option value="logic">逻辑分析</option>
            <option value="source">来源查证</option>
            <option value="expand">扩写</option>
            <option value="relate">关联分析</option>
          </select>
          <button id="btn-batch" type="button">整篇审阅</button>
        </div>
        <p class="rd-shortcut-hint">⌘/Ctrl+Enter 执行 · ⌘/Ctrl+K 搜索</p>
      </section>

      <div class="rd-history-head">
        <span class="rd-label">历史结果</span>
        <button id="btn-clear" type="button" class="rd-mini" title="清空历史结果">清空</button>
      </div>
      <input id="search" class="rd-search" type="search" placeholder="搜索历史（内容 / 要求）" />
      <div id="filter-tabs" class="rd-filter"></div>
      <div id="history-list" class="rd-history-list"></div>

      <footer class="rd-side-foot">
        <details class="rd-export">
          <summary>导出 / 审核包</summary>
          <div class="rd-export-actions">
            <button id="btn-export-package" type="button">导出审核包 (.json)</button>
            <button id="btn-export-report" type="button">导出审稿报告 (.md)</button>
            <button id="btn-copy-package" type="button">复制审核包</button>
          </div>
          <p id="export-hint" class="rd-hint">导出文件由本机桥写入 DSH 指定的目录。</p>
        </details>
        <details>
          <summary>连接设置</summary>
          <label>桥地址
            <input id="bridge-url" type="text" spellcheck="false" />
          </label>
          <label>访问令牌（可选）
            <input id="bridge-token" type="password" spellcheck="false" placeholder="REVIEW_DESK_WPS_TOKEN" />
          </label>
          <div class="rd-bridge-row">
            <button id="btn-check" type="button" class="rd-mini">检测连接</button>
          </div>
          <p id="bridge-hint" class="rd-hint">默认连接本机 DSH 的文稿审核桥（127.0.0.1:47831）。</p>
        </details>
      </footer>
    </aside>
    <div id="side-resizer" class="rd-resizer" role="separator" aria-orientation="vertical" title="拖动调整左栏宽度（双击复位）"></div>

    <main class="rd-main">
      <div id="batch-bar" class="rd-batch" hidden>
        <div class="rd-batch-text"></div>
        <div class="rd-batch-progress"><div class="rd-batch-fill"></div></div>
        <button id="btn-cancel-batch" type="button">取消</button>
      </div>
      <div id="detail-empty" class="rd-empty">
        <p>从左侧选择一条结果，或选中文字开始一次审核。</p>
        <p class="rd-hint">结果会保存在本机；替换以 WPS「修订」写入，可接受 / 拒绝，或 ⌘Z 撤销。</p>
      </div>
      <article id="detail" class="rd-detail" hidden></article>
    </main>
  </div>

  <div id="toast" class="rd-toast" role="status" aria-live="polite"></div>

  <script src="./taskpane.js"></script>
</body>
</html>
