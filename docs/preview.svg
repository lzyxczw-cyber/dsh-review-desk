  <rect x="484" y="106" width="58" height="16" rx="8" fill="#EEF3FB" stroke="#DEE5F0" stroke-width="1"/>
  <rect x="492" y="112" width="40" height="4" rx="2" fill="#B7C4D8"/>
  <rect x="548" y="106" width="52" height="16" rx="8" fill="#EEF3FB" stroke="#DEE5F0" stroke-width="1"/>
  <rect x="556" y="112" width="36" height="4" rx="2" fill="#B7C4D8"/>

  <rect x="470" y="152" width="142" height="62" rx="11" fill="#FFFFFF" stroke="#E2E7F0" stroke-width="1"/>
