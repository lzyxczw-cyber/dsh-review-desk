  <g fill="#E4E9F1">
    <rect x="350" y="66" width="76" height="5" rx="2.5"/>
    <rect x="350" y="96" width="70" height="5" rx="2.5"/>
    <rect x="350" y="126" width="78" height="5" rx="2.5"/>
    <rect x="350" y="156" width="64" height="5" rx="2.5"/>
