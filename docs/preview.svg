  <rect x="280" y="96" width="3" height="22" rx="1.5" fill="#2C58D8"/>

  <!-- Column 2: review actions -->
  <rect x="320" y="36" width="126" height="150" rx="11" fill="#FFFFFF" stroke="#E2E7F0" stroke-width="1"/>
  <g fill="#CFDDF7">
    <circle cx="336" cy="58" r="6"/>
    <circle cx="336" cy="88" r="6"/>
    <circle cx="336" cy="118" r="6"/>
    <circle cx="336" cy="148" r="6"/>
