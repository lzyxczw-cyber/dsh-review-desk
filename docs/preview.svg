  <rect x="470" y="36" width="142" height="104" rx="11" fill="#FFFFFF" stroke="#E2E7F0" stroke-width="1"/>
  <circle cx="486" cy="55" r="5" fill="#2C58D8"/>
  <rect x="498" y="51" width="52" height="8" rx="4" fill="#C3CCDB"/>
  <rect x="484" y="72" width="116" height="6" rx="3" fill="#DCE2EC"/>
