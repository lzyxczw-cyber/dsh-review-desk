  </defs>

  <rect width="640" height="300" rx="16" fill="url(#rd-canvas)"/>

  <!-- Column separators -->
  <rect x="306" y="36" width="1" height="228" fill="#E2E7F0"/>
  <rect x="458" y="36" width="1" height="228" fill="#E2E7F0"/>

  <!-- Column 1: manuscript -->
  <rect x="28" y="36" width="262" height="228" rx="12" fill="#FFFFFF" stroke="#E2E7F0" stroke-width="1"/>
  <rect x="46" y="56" width="128" height="10" rx="5" fill="#BFC8D8"/>
  <rect x="46" y="76" width="82" height="6" rx="3" fill="#DCE2EC"/>

  <rect x="40" y="98" width="238" height="18" rx="4" fill="#E3ECFF"/>
  <rect x="46" y="103" width="188" height="7" rx="3.5" fill="#93B4F2"/>
  <rect x="46" y="128" width="220" height="6" rx="3" fill="#DCE2EC"/>
