  <rect x="498" y="167" width="44" height="8" rx="4" fill="#C3CCDB"/>
  <rect x="484" y="186" width="112" height="6" rx="3" fill="#DCE2EC"/>
  <rect x="484" y="198" width="72" height="6" rx="3" fill="#E4E9F1"/>

  <rect x="470" y="226" width="142" height="38" rx="11" fill="#FFFFFF" stroke="#E2E7F0" stroke-width="1"/>
  <circle cx="486" cy="245" r="5" fill="#CFE0FB"/>
  <rect x="498" y="241" width="60" height="8" rx="4" fill="#D4DBE7"/>
